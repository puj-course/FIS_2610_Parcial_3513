name: CI - Pruebas y Cobertura

on:
  push:
    branches: [ Grupo3 ]

  pull_request:
    branches: [ Grupo3 ]

  workflow_dispatch:

jobs:


  build:
    name: "Stage 1 - Compilación"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar proyecto
        run: mvn compile --no-transfer-progress


  test:
    name: "Stage 2 - Pruebas Unitarias"
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Crear configuración de pruebas
        run: |
          mkdir -p src/test/resources

          cat > src/test/resources/application-test.properties << 'PROPS'
          spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
          spring.datasource.driver-class-name=org.h2.Driver
          spring.datasource.username=sa
          spring.datasource.password=
          spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
          spring.jpa.hibernate.ddl-auto=create-drop
          spring.security.user.name=test
          spring.security.user.password=test
          telegram.bot.token=dummy
          telegram.bot.chat-id=dummy
          PROPS