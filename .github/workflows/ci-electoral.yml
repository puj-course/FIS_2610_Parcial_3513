name: CI — Pruebas Electoral (Federico)

on:
  push:
    branches: [ "GRUPO-5" ]
  pull_request:
    branches: [ "GRUPO-5" ]

jobs:
  build-and-test:
    name: Compilar y Probar Sistema Electoral
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Compilar y Ejecutar Pruebas con Maven
      run: |
        mvn -B test

    - name: Subir reportes de Surefire (resultados de pruebas)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: surefire-reports-electoral
        path: target/surefire-reports/
