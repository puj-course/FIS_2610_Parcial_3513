name: CD Parcial2     

on:
  push:
    branches: [Grupo3]
  workflow_dispatch:
  #Solo ejecuta si el CI pasó exitosamente
  workflow_run:
    workflows: ["CI - Pruebas y Cobertura"]
    branches: [Grupo3]
    types:
      - completed

jobs:
  # Job que verifica si el CI pasó antes de continuar
  check-ci-status:
    name: Verificar estado del CI
    runs-on: ubuntu-22.04
    # Solo continúa si el workflow fue exitoso o si fue disparado manualmente
    if: |
      github.event_name == 'workflow_dispatch' || 
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Verificar conclusión del CI
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            if [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
              echo "❌ CI falló - Bloqueando deploy"
              exit 1
            fi
            echo "✅ CI exitoso - Continuando con deploy"
          else
            echo "⚙️ Ejecución manual - Saltando verificación de CI"
          fi

  # Job 1: Calcular versión una sola vez y compartirla
  setup:
    name: Calcular versión
    runs-on: ubuntu-22.04
    needs: check-ci-status
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Calcular versión del proyecto
        id: version
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION-$SHORT_SHA" >> $GITHUB_OUTPUT

  # Job 2: Compilar y ejecutar pruebas
  build-and-test:
    name: Compilar proyecto y pruebas
    runs-on: ubuntu-22.04
    needs: setup

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Compilar y verificar cobertura
        run: mvn clean verify

      - name: Verificar que el .jar existe
        run: ls target/*.jar

      - name: Guardar .jar como artefacto del pipeline
        uses: actions/upload-artifact@v4
        with:
          name: Parcial2-jar
          path: target/*.jar
          retention-days: 1

        github-release:
          name: Crear GitHub Release
          runs-on: ubuntu-22.04
          needs: [ setup, build-and-test ]
          permissions:
            contents: write

          steps:
            - name: Descargar código
              uses: actions/checkout@v4

            - name: Descargar artefacto .jar
              uses: actions/download-artifact@v4
              with:
                name: Parcial2Grupo3-jar
                path: target/

            # FIX: SHA completo en lugar de @v2
            - name: Crear GitHub Release y subir .jar
              uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2.2.2
              with:
                tag_name: ${{ needs.setup.outputs.tag }}
                name: "Release ${{ needs.setup.outputs.tag }}"
                body: |
                  Despliegue automático generado por merge a `main`.

                  **Commit:** ${{ github.sha }}
                  **Autor:** ${{ github.actor }}