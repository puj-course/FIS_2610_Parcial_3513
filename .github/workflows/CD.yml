# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: CD GRUPO 2 | ALE CORREDOR & SALOME AVILA

on:
  push:
    branches: [ "features-grupo2" ] # para la ejecución de la pipeline en el push de nuestra branch de grupo

jobs:
  build:
    runs-on: ubuntu-latest
    # environment: .env

    steps:
    
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Construir con maven
      run: mvn clean install --batch-mode

    - name: Realizar las pruebas # falta implementar las pruebas 
      run: mvn test

    - name: hacer el artefacto
      run: |
          mkdir -p release
          cp pom.xml release/
          cd release && zip -r ../programaProcesoEl.zip .

    - name: artefacto como github release
      uses: softprops/action-gh-release@v2
      with:
        name: "releaseSistemaJurado"
        files: programaProcesoEl.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

